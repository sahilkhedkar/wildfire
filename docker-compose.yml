services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildfire}
      POSTGRES_DB: ${POSTGRES_DB:-wildfire}
    ports:
      - "5432:5432"
    volumes:
      - wildfire-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildfire -d wildfire"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wildfire-postgres:
